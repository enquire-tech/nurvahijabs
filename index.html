<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NŪRVĀ HIJABS — Confidence in Every Layer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root {
 --cream: #eee7dc;
 --light: #f5f0e8;
 --black: #171513;
 --gray: #6e675f;
 --line: rgba(23,21,19,.15);

 --serif: "Cormorant Garamond", Georgia, serif;
 --sans: "Inter", Arial, sans-serif;
}

* {
 box-sizing: border-box;
}

html {
 scroll-behavior: smooth;
 background: var(--cream);
}

body {
 margin: 0;
 background: var(--cream);
 color: var(--black);
 font-family: var(--sans);
 overflow-x: hidden;
 -webkit-font-smoothing: antialiased;
}

img {
 display: block;
 max-width: 100%;
}

a {
 color: inherit;
 text-decoration: none;
}

/* TOP SHIPPING BAR */

.topbar {
 height: 28px;
 background: #111;
 color: white;

 display: flex;
 justify-content: center;
 align-items: center;

 gap: 20px;

 font-size: 8px;
 letter-spacing: .18em;
 text-transform: uppercase;
}

/* NAVIGATION */

.nav {
 height: 76px;

 display: grid;
 grid-template-columns: 1fr auto 1fr;
 align-items: center;

 padding: 0 42px;

 position: relative;
 z-index: 100;

 background: rgba(238,231,220,.94);

 backdrop-filter: blur(15px);
 -webkit-backdrop-filter: blur(15px);

 border-bottom: 1px solid rgba(23,21,19,.07);
}

.nav-links {
 display: flex;
 gap: 28px;

 font-size: 9px;
 letter-spacing: .15em;
 text-transform: uppercase;
}

.nav-logo {
 text-align: center;

 font-family: var(--serif);
 font-size: 28px;
 letter-spacing: .22em;
}

.nav-logo small {
 display: block;

 font-family: var(--sans);
 font-size: 6px;
 letter-spacing: .55em;

 margin-top: 7px;
}

.nav-actions {
 justify-self: end;

 display: flex;
 gap: 17px;
}

/* HERO */

.hero {
 min-height: calc(100vh - 104px);

 position: relative;
 overflow: hidden;

 display: flex;
 align-items: center;
}

.hero-copy {
 position: relative;
 z-index: 5;

 width: 43%;
 margin-left: 7%;

 padding: 70px 0;
}

.eyebrow {
 font-size: 9px;
 letter-spacing: .32em;
 text-transform: uppercase;

 margin-bottom: 18px;
}

.hero h1 {
 font-family: var(--serif);

 font-weight: 500;

 font-size: clamp(58px, 6vw, 105px);

 line-height: .82;

 letter-spacing: -.045em;

 margin: 0 0 28px;
}

.hero p {
 max-width: 360px;

 color: var(--gray);

 font-size: 12px;
 line-height: 1.7;

 margin-bottom: 28px;
}

.btn {
 display: inline-flex;
 align-items: center;
 gap: 20px;

 background: var(--black);
 color: white;

 padding: 14px 19px;

 font-size: 8px;
 letter-spacing: .16em;
 text-transform: uppercase;
}

.hero-fabric {
 position: absolute;

 width: 67vw;
 height: 110%;

 right: -4%;
 top: -5%;

 object-fit: cover;

 mix-blend-mode: multiply;

 filter: saturate(.72) contrast(.97);

 transform: translate3d(0,0,0) scale(1.05);

 will-change: transform;
}

.scroll {
 position: absolute;

 bottom: 30px;
 left: 7%;

 font-size: 7px;
 letter-spacing: .22em;
 text-transform: uppercase;

 color: var(--gray);
}

.scroll:after {
 content: "";

 display: block;

 width: 1px;
 height: 32px;

 background: var(--line);

 margin-top: 10px;
}

/* FEATURE BAR */

.features {
 display: grid;
 grid-template-columns: repeat(5,1fr);

 border-top: 1px solid var(--line);
 border-bottom: 1px solid var(--line);

 background: var(--light);
}

.feature {
 min-height: 105px;

 padding: 23px 12px;

 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;

 text-align: center;

 border-right: 1px solid var(--line);
}

.feature:last-child {
 border-right: 0;
}

.feature-icon {
 font-size: 19px;
 height: 27px;
}

.feature b {
 font-size: 8px;

 letter-spacing: .16em;

 text-transform: uppercase;

 margin-bottom: 5px;
}

.feature span {
 font-size: 7px;

 color: var(--gray);
}

/* EDITORIAL SECTIONS */

.editorial {
 position: relative;

 height: min(42vw,610px);

 min-height: 360px;

 overflow: hidden;

 display: flex;
 align-items: center;

 border-bottom: 1px solid rgba(23,21,19,.09);
}

.editorial-copy {
 position: relative;

 z-index: 5;

 width: 34%;

 padding: 50px 6.5vw;
}

.editorial-copy.right {
 margin-left: auto;
}

.section-number {
 font-size: 9px;

 color: var(--gray);

 margin-bottom: 34px;
}

.editorial h2 {
 font-family: var(--serif);

 font-size: clamp(45px,5vw,80px);

 font-weight: 500;

 line-height: .82;

 letter-spacing: -.045em;

 margin: 0 0 22px;
}

.editorial p {
 font-size: 10px;

 line-height: 1.65;

 color: var(--gray);

 max-width: 250px;

 margin-bottom: 24px;
}

.explore {
 font-size: 8px;

 letter-spacing: .15em;

 text-transform: uppercase;

 font-weight: 600;
}

.editorial-media {
 position: absolute;

 top: -10%;
 bottom: -10%;

 width: 72%;

 object-fit: cover;

 mix-blend-mode: multiply;

 filter: saturate(.76);

 will-change: transform;
}

.media-right .editorial-media {
 right: -3%;
}

.media-left .editorial-media {
 left: -3%;
}

/* COLLECTION */

.collection {
 padding: 100px 6.5vw 90px;

 background: var(--light);
}

.collection-head {
 display: grid;

 grid-template-columns: 1.2fr .8fr;

 gap: 50px;

 align-items: end;

 margin-bottom: 48px;
}

.collection h2 {
 font-family: var(--serif);

 font-size: clamp(54px,5.5vw,84px);

 font-weight: 500;

 line-height: .82;

 letter-spacing: -.045em;

 margin: 10px 0 0;
}

.collection-intro {
 font-size: 10px;

 line-height: 1.7;

 color: var(--gray);

 max-width: 330px;
}

.products {
 display: grid;

 grid-template-columns: repeat(4,1fr);

 gap: 24px;
}

.product-image {
 aspect-ratio: 1.08 / 1;

 overflow: hidden;

 background: #e2d9cd;
}

.product-image img {
 width: 100%;
 height: 100%;

 object-fit: cover;

 transition: transform .8s ease;
}

.product:hover img {
 transform: scale(1.045);
}

.product-name {
 font-family: var(--serif);

 font-size: 17px;

 margin-top: 12px;
}

.product-price {
 font-size: 9px;

 color: var(--gray);

 margin-top: 4px;
}

/* STORY */

.story {
 position: relative;

 min-height: 570px;

 display: flex;
 align-items: center;

 overflow: hidden;

 background: #d8c8b9;
}

.story img {
 position: absolute;

 inset: -7% 0;

 width: 100%;
 height: 114%;

 object-fit: cover;

 mix-blend-mode: multiply;

 filter: saturate(.72);

 will-change: transform;
}

.story-copy {
 position: relative;

 z-index: 5;

 padding: 80px 7%;

 max-width: 620px;
}

.story h2 {
 font-family: var(--serif);

 font-size: clamp(55px,6vw,88px);

 line-height: .8;

 letter-spacing: -.045em;

 font-weight: 500;

 margin: 14px 0 25px;
}

.story p {
 font-size: 11px;

 line-height: 1.7;

 max-width: 330px;

 color: #514a43;
}

/* NEWSLETTER */

.newsletter {
 text-align: center;

 padding: 105px 25px 100px;

 background: var(--light);
}

.newsletter h2 {
 font-family: var(--serif);

 font-size: clamp(48px,5vw,72px);

 font-weight: 500;

 line-height: .9;

 margin: 0 0 15px;
}

.newsletter p {
 font-size: 10px;

 color: var(--gray);

 margin-bottom: 28px;
}

.signup {
 display: flex;

 max-width: 540px;

 margin: auto;
}

.signup input {
 flex: 1;

 border: 1px solid var(--line);

 background: white;

 padding: 14px 16px;

 font-size: 10px;
}

.signup button {
 border: 0;

 background: var(--black);

 color: white;

 padding: 0 22px;

 font-size: 8px;

 letter-spacing: .15em;

 text-transform: uppercase;
}

/* FOOTER */

.footer {
 border-top: 1px solid var(--line);

 padding: 48px 6.5vw 30px;

 display: grid;

 grid-template-columns: 1fr 2fr 1fr;

 align-items: end;
}

.footer-logo {
 font-family: var(--serif);

 font-size: 28px;

 letter-spacing: .23em;
}

.footer-links {
 display: flex;

 justify-content: center;

 gap: 25px;

 font-size: 8px;

 letter-spacing: .12em;

 text-transform: uppercase;
}

.footer-copy {
 justify-self: end;

 font-size: 8px;

 color: var(--gray);
}
