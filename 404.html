<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NURVA HIJABS</title>
<script>
// Single Page Apps for GitHub Pages — redirects any unknown path back to
// index.html with the original path encoded in a query string, which
// index.html then decodes and restores via history.replaceState().
var segmentCount = 0;
var l = window.location;
l.replace(
  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
  l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
  l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
  (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
  l.hash
);
</script>
</head>
<body></body>
</html>
